spring.application.name=A3OSU

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.liquibase.change-log=classpath:config/liquibase/master.xml
spring.liquibase.enabled=true

api.security.token.secret=${JWT_SECRET}

api.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

primary.datasource.driverClassName=com.mysql.cj.jdbc.Driver
primary.datasource.jdbc-url=${APP_DATABASE_JDBC_URL}
primary.datasource.username=${APP_DATABASE_JDBC_USER}
primary.datasource.password=${APP_DATABASE_JDBC_PASSWORD}